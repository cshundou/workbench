# AI Workbench - Docker Compose
# PostgreSQL 16 + Redis 7 + FastAPI backend + Vue frontend
# Stage 6: add nginx service using nginx/nginx.conf as reverse proxy

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-workbench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_workbench_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ai_workbench}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ai_workbench} -d ${POSTGRES_DB:-ai_workbench}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ai-workbench-network

  redis:
    image: redis:7-alpine
    container_name: ai-workbench-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - ai-workbench-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-workbench-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Docker 网络内使用服务名作为主机名
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ai_workbench}:${POSTGRES_PASSWORD:-ai_workbench_secret}@postgres:5432/${POSTGRES_DB:-ai_workbench}
      REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - chroma_data:/app/chroma_data
      - upload_data:/app/uploads
    networks:
      - ai-workbench-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-workbench-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内通过 Vite 代理转发到 backend 服务
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - ai-workbench-network

  # Stage 6: 取消注释以启用 Nginx 反向代理
  # nginx:
  #   image: nginx:1.25-alpine
  #   container_name: ai-workbench-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "${NGINX_HTTP_PORT:-80}:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - ai-workbench-network

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  upload_data:
  frontend_node_modules:

networks:
  ai-workbench-network:
    driver: bridge
