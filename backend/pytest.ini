[pytest]
asyncio_mode = auto
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source = app
omit =
    app/worker.py
    app/services/task_worker.py
    app/models/*
    app/api/*
    app/main.py

[coverage:report]
fail_under = 70
show_missing = true
skip_covered = false
