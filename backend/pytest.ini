[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source =
    app/core/permissions.py
    app/core/security.py
    app/services/rag/chunker.py
    app/services/rag/retriever.py
    app/services/agent/tools/python_repl.py
    app/services/rag/rag_service.py
    app/services/workflow/graph_builder.py
omit =
    app/core/database.py

[coverage:report]
fail_under = 70
show_missing = true
skip_covered = false
